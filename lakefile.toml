name = "verified-lcalc"
version = "0.1.0"
defaultTargets = ["VerifiedLcalc", "ec-coefficients", "exp-enclosure", "precision-policy", "import-lmfdb"]

# Local checkout at 3440367ed1804626334f13a3a534a9cbb3385a59.
# See docs/BUILD.md for the portable dependency configuration.
[[require]]
name = "mathlib"
path = "../mathlib4"

[[lean_lib]]
name = "VerifiedLcalc"

[[lean_lib]]
name = "VerifiedLcalcTests"
srcDir = "tests"

[[lean_exe]]
name = "ec-coefficients"
root = "EcMain"

[[lean_exe]]
name = "exp-enclosure"
root = "ExpMain"

[[lean_exe]]
name = "precision-policy"
root = "PrecisionMain"

[[lean_exe]]
name = "import-lmfdb"
root = "ImportLmfdbMain"
