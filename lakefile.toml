name = "verified-lcalc"
version = "0.1.0"
defaultTargets = ["VerifiedLcalc", "ec-coefficients", "exp-enclosure", "precision-policy", "import-lmfdb"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "31ce06eaadf4a200c0e1407c5f10953cf606b8f8"

[[require]]
name = "TauCeti"
git = "https://github.com/TauCetiProject/TauCeti"
rev = "e0e414ce57522ba17560057ad0d7f2edab91bf0c"

[[lean_lib]]
name = "VerifiedLcalc"

# Keep the matrix inputs in sync with lakefile.certificates.lean.
[[input_file]]
name = "witness_tests_fixtures_lmfdb_112_a2"
path = "tests/fixtures/lmfdb/112.a2.json"
text = true

[[input_file]]
name = "witness_tests_fixtures_lmfdb_179_a1"
path = "tests/fixtures/lmfdb/179.a1.json"
text = true

[[input_file]]
name = "witness_tests_fixtures_lmfdb_197_a1"
path = "tests/fixtures/lmfdb/197.a1.json"
text = true

[[input_file]]
name = "witness_tests_fixtures_lmfdb_214_a1"
path = "tests/fixtures/lmfdb/214.a1.json"
text = true

[[input_file]]
name = "witness_tests_fixtures_lmfdb_243_a1"
path = "tests/fixtures/lmfdb/243.a1.json"
text = true

[[input_file]]
name = "witness_tests_fixtures_lmfdb_254_a1"
path = "tests/fixtures/lmfdb/254.a1.json"
text = true

[[input_file]]
name = "witness_tests_fixtures_lmfdb_275_a1"
path = "tests/fixtures/lmfdb/275.a1.json"
text = true

[[input_file]]
name = "witness_tests_fixtures_lmfdb_286_f1"
path = "tests/fixtures/lmfdb/286.f1.json"
text = true

[[input_file]]
name = "witness_tests_fixtures_lmfdb_288_a1"
path = "tests/fixtures/lmfdb/288.a1.json"
text = true

[[input_file]]
name = "witness_tests_fixtures_lmfdb_291_d1"
path = "tests/fixtures/lmfdb/291.d1.json"
text = true

[[input_file]]
name = "witness_tests_fixtures_lmfdb_107200_dh1_tamagawa"
path = "tests/fixtures/lmfdb/107200.dh1-tamagawa.json"
text = true

[[input_file]]
name = "witness_tests_fixtures_lmfdb_37_a1_trace_hash"
path = "tests/fixtures/lmfdb/37.a1-trace-hash-source.json"
text = true

[[lean_lib]]
name = "VerifiedLcalcTests"
srcDir = "tests"
needs = [
  "@/witness_tests_fixtures_lmfdb_112_a2",
  "@/witness_tests_fixtures_lmfdb_179_a1",
  "@/witness_tests_fixtures_lmfdb_197_a1",
  "@/witness_tests_fixtures_lmfdb_214_a1",
  "@/witness_tests_fixtures_lmfdb_243_a1",
  "@/witness_tests_fixtures_lmfdb_254_a1",
  "@/witness_tests_fixtures_lmfdb_275_a1",
  "@/witness_tests_fixtures_lmfdb_286_f1",
  "@/witness_tests_fixtures_lmfdb_288_a1",
  "@/witness_tests_fixtures_lmfdb_291_d1",
  "@/witness_tests_fixtures_lmfdb_107200_dh1_tamagawa",
  "@/witness_tests_fixtures_lmfdb_37_a1_trace_hash",
]

[[lean_exe]]
name = "ec-coefficients"
root = "EcMain"

[[lean_exe]]
name = "exp-enclosure"
root = "ExpMain"

[[lean_exe]]
name = "precision-policy"
root = "PrecisionMain"

[[lean_exe]]
name = "import-lmfdb"
root = "ImportLmfdbMain"
