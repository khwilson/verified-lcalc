name: Refresh certificate companion
on:
  workflow_dispatch:
jobs:
  deploy:
    name: Deploy checked fixture evidence and existing catalogs
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: ec-certificate-publishing
      queue: max
    permissions:
      contents: read
      pages: write
      id-token: write
    env:
      PAGES_ARTIFACT: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Assemble site from existing published catalogs
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish_ec_catalog.sh site "" "$RUNNER_TEMP/ec-site"
      - name: Upload Pages site
        id: pages-artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          name: ${{ env.PAGES_ARTIFACT }}
          path: ${{ runner.temp }}/ec-site/
      - name: Wait for the uploaded Pages artifact
        uses: ./.github/actions/wait-for-pages-artifact
        env:
          PAGES_ARTIFACT_ID: ${{ steps.pages-artifact.outputs.artifact_id }}
      - name: Deploy Pages site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT }}
