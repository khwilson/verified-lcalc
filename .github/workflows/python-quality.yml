name: Python quality and registry tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.14"]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: lcalc_registry_test
          POSTGRES_USER: registry
          POSTGRES_PASSWORD: registry
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U registry -d lcalc_registry_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      REGISTRY_TEST_DATABASE_URL: postgresql+psycopg://registry:registry@127.0.0.1:5432/lcalc_registry_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.25"
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: make check
      - run: make test
