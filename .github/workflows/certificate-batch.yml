name: Certificate batch benchmark
run-name: >-
  Certificate batch (offset ${{ inputs.offset }}, count ${{ inputs.count }})
  ${{ inputs.parent_run && format('after {0}', inputs.parent_run) || '' }}
on:
  workflow_dispatch:
    inputs:
      count:
        description: Number of curves to select from the tracked LMFDB snapshot
        type: number
        default: 1000
        required: true
      offset:
        description: Number of leading rows to skip (zero-based)
        type: number
        default: 0
        required: true
      publish_modules:
        description: Include compiled modules and ZIP bundles in the release
        type: boolean
        default: false
        required: true
      through_batch:
        description: Last 1,000-curve batch to run (1–10, or 0 for only this run)
        type: number
        default: 0
      parent_run:
        description: Automatically set to the preceding run ID and attempt
        type: string
        default: ''
permissions:
  contents: read
jobs:
  benchmark:
    name: Benchmark production certify_ec
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    outputs:
      release-tag: ${{ steps.catalog.outputs.release-tag }}
      artifact-id: ${{ steps.transfer.outputs.artifact-id }}
      next-offset: ${{ steps.chain.outputs.next-offset }}
    defaults:
      run:
        working-directory: verified-lcalc
    env:
      BENCHMARK_REPORT: ${{ github.workspace }}/certificate-batch.json
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: verified-lcalc
          persist-credentials: false
      - name: Validate batch chain
        id: chain
        if: inputs.through_batch != 0 || inputs.parent_run != ''
        env:
          COUNT: ${{ inputs.count }}
          OFFSET: ${{ inputs.offset }}
          THROUGH_BATCH: ${{ inputs.through_batch }}
          PARENT_RUN: ${{ inputs.parent_run }}
        run: python3 scripts/plan_ec_batch_chain.py
      - name: Set up Lean and restore cached artifacts
        uses: ./verified-lcalc/.github/actions/setup-lean
      - name: Generate witnesses and verify certificates
        id: benchmark
        env:
          COUNT: ${{ inputs.count }}
          OFFSET: ${{ inputs.offset }}
        run: |
          # Leave time to summarize and upload the last checkpoint on timeout.
          status=0
          timeout --kill-after=30s 240m python3 -u scripts/benchmark_ec_dataset.py \
            --source data/lmfdb/sql-10000/inputs.json \
            --references data/lmfdb/sql-10000/references.json \
            --count "$COUNT" --offset "$OFFSET" \
            --module-prefix "Run${GITHUB_RUN_ID}Attempt${GITHUB_RUN_ATTEMPT}" \
            --workers 2 --batch-size 20 --batch-work-limit 4000 --timeout 1800 \
            --output "$BENCHMARK_REPORT" || status=$?
          if (( status != 0 )); then
            for log in .lake/ec-dataset-*/prebuild.log; do
              if [[ -f "$log" ]]; then
                echo "Tail of $log"
                tail -n 40 "$log"
              fi
            done
          fi
          exit "$status"
      - name: Summarize benchmark
        if: ${{ !cancelled() }}
        env:
          BENCHMARK_OUTCOME: ${{ steps.benchmark.outcome }}
        run: |
          if [[ -s "$BENCHMARK_REPORT" ]]; then
            python3 scripts/report_ec_batch.py "$BENCHMARK_REPORT" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo '## Certificate batch benchmark'
              echo
              printf 'The benchmark step ended with status `%s` before producing a JSON report.\n' "$BENCHMARK_OUTCOME"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload raw benchmark report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: certificate-batch-report-${{ github.run_attempt }}
          path: ${{ env.BENCHMARK_REPORT }}
          if-no-files-found: ignore
      - name: Audit and export proof catalog
        id: catalog
        env:
          PUBLISH_MODULES: ${{ inputs.publish_modules }}
        run: |
          release_tag="ec-certificates-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          export_args=()
          if [[ "$PUBLISH_MODULES" == false ]]; then
            export_args+=(--witness-only)
          fi
          python3 scripts/export_ec_catalog.py "$BENCHMARK_REPORT" "$RUNNER_TEMP/ec-catalog" \
            --release-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$release_tag" \
            "${export_args[@]}"
          echo "release-tag=$release_tag" >> "$GITHUB_OUTPUT"
      - name: Test replay of the exported witness archive
        run: |
          catalog="$RUNNER_TEMP/ec-catalog/catalog.json"
          label=$(jq -r 'first(.curves[] | select(.status == "checked") | .label) // empty' "$catalog")
          replay_args=()
          if [[ -n "$label" ]]; then
            replay_args+=(--curve "$label")
          fi
          python3 scripts/replay_ec_batch.py "$catalog" "$RUNNER_TEMP/ec-catalog/witnesses.jsonl.gz" \
            "${replay_args[@]}"
      - name: Transfer audited catalog and proof files
        if: github.ref == 'refs/heads/main'
        id: transfer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.catalog.outputs.release-tag }}
          path: ${{ runner.temp }}/ec-catalog/
          if-no-files-found: error

  attest:
    name: Attest audited certificate records
    if: github.repository == 'khwilson/verified-lcalc' && github.ref == 'refs/heads/main' && needs.benchmark.outputs.artifact-id != ''
    needs: benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      bundle-id: ${{ steps.transfer-bundle.outputs.artifact-id }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.benchmark.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/ec-release
      - name: Require both replay files
        run: |
          test -s "$RUNNER_TEMP/ec-release/catalog.json"
          test -s "$RUNNER_TEMP/ec-release/witnesses.jsonl.gz"
      - name: Sign build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/ec-release/catalog.json
            ${{ runner.temp }}/ec-release/witnesses.jsonl.gz
      - name: Stage signed bundle
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          test -s "$BUNDLE_PATH"
          cp -- "$BUNDLE_PATH" "$RUNNER_TEMP/provenance.sigstore.json"
      - name: Transfer signed bundle
        id: transfer-bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: provenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/provenance.sigstore.json
          if-no-files-found: error

  publish:
    name: Publish audited certificate release
    if: github.ref == 'refs/heads/main'
    needs: [benchmark, attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: ec-certificate-publishing
      queue: max
    permissions:
      contents: write
    outputs:
      release-tag: ${{ needs.benchmark.outputs.release-tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.benchmark.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/ec-release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.attest.outputs.bundle-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/ec-release
      - name: Upload release assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.benchmark.outputs.release-tag }}
        run: bash scripts/publish_ec_catalog.sh release "$RELEASE_TAG" "$RUNNER_TEMP/ec-release"

  deploy:
    name: Deploy cumulative certificate companion
    if: github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: ec-certificate-publishing
      queue: max
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    env:
      PAGES_ARTIFACT: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Assemble site with published catalogs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.publish.outputs.release-tag }}
        run: bash scripts/publish_ec_catalog.sh site "$RELEASE_TAG" "$RUNNER_TEMP/ec-site"
      - name: Upload Pages site
        id: pages-artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          name: ${{ env.PAGES_ARTIFACT }}
          path: ${{ runner.temp }}/ec-site/
      - name: Wait for the uploaded Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ steps.pages-artifact.outputs.artifact_id }}
        run: bash scripts/publish_ec_catalog.sh wait-pages-artifact "$PAGES_ARTIFACT" "$PAGES_ARTIFACT_ID"
      - name: Deploy Pages site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT }}

  dispatch:
    name: Dispatch next certificate batch
    if: >-
      github.repository == 'khwilson/verified-lcalc' &&
      github.ref == 'refs/heads/main' &&
      needs.deploy.result == 'success' &&
      needs.benchmark.outputs.next-offset != ''
    needs: [benchmark, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      NEXT_OFFSET: ${{ needs.benchmark.outputs.next-offset }}
    steps:
      - name: Check earlier attempts for this dispatch
        id: previous
        run: |
          for ((attempt = 1; attempt < GITHUB_RUN_ATTEMPT; attempt++)); do
            endpoint="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$attempt/jobs?per_page=100"
            prior=$(gh api --paginate --slurp "$endpoint" | jq -r '
              [.[].jobs[] | select(.name == "Dispatch next certificate batch") |
                if .conclusion == "skipped" then "skipped"
                else ([.steps[] | select(.name == "Submit workflow dispatch") |
                  .conclusion][0] // "unknown") end][0] // "skipped"')
            attempt_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$attempt"
            case "$prior" in
              success)
                echo "already-dispatched=true" >> "$GITHUB_OUTPUT"
                printf 'Offset %s was dispatched in [attempt %s](%s).\n' \
                  "$NEXT_OFFSET" "$attempt" "$attempt_url" >> "$GITHUB_STEP_SUMMARY"
                exit 0
                ;;
              skipped) ;;
              *)
                printf 'Check [attempt %s](%s) and the workflow run list for a child at offset %s before dispatching manually.\n' \
                  "$attempt" "$attempt_url" "$NEXT_OFFSET" >> "$GITHUB_STEP_SUMMARY"
                exit 1
                ;;
            esac
          done
      - name: Submit workflow dispatch
        if: steps.previous.outputs.already-dispatched != 'true'
        env:
          THROUGH_BATCH: ${{ inputs.through_batch }}
          PUBLISH_MODULES: ${{ inputs.publish_modules }}
        run: |
          parent="$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT"
          endpoint="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/certificate-batch.yml/dispatches"
          payload=$(jq -n --arg offset "$NEXT_OFFSET" --arg through "$THROUGH_BATCH" \
            --arg publish "$PUBLISH_MODULES" --arg parent "$parent" \
            '{ref: "main", inputs: {count: "1000", offset: $offset, through_batch: $through,
              publish_modules: $publish, parent_run: $parent}}')
          printf 'Requested offset %s through batch %s from run %s.\n\n' \
            "$NEXT_OFFSET" "$THROUGH_BATCH" "$parent" >> "$GITHUB_STEP_SUMMARY"
          if ! response=$(curl --silent --show-error --fail-with-body --max-time 30 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            --header "Content-Type: application/json" \
            --data "$payload" "$endpoint") ||
            ! next_run=$(jq -er '.workflow_run_id | select(type == "number" and . > 0)' <<< "$response"); then
            echo 'Check the workflow run list for this offset and parent before dispatching manually.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          printf '[Run %s](%s/%s/actions/runs/%s) will process offset %s.\n' \
            "$next_run" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$next_run" "$NEXT_OFFSET" >> "$GITHUB_STEP_SUMMARY"
