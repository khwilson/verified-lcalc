name: Lean verification
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  lean:
    name: Lean certificates and lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: verified-lcalc
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: verified-lcalc
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.25"
          python-version: "3.14"
      - name: Install pinned elan and Lean toolchain
        env:
          ELAN_VERSION: v4.2.3
          ELAN_SHA256: df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2
        run: |
          curl -fsSL "https://github.com/leanprover/elan/releases/download/${ELAN_VERSION}/elan-x86_64-unknown-linux-gnu.tar.gz" -o elan.tar.gz
          echo "${ELAN_SHA256}  elan.tar.gz" | sha256sum -c -
          tar -xzf elan.tar.gz elan-init
          ./elan-init -y --default-toolchain none
          rm elan-init elan.tar.gz
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
      - name: Fetch targeted Mathlib cache
        env:
          MATHLIB_CACHE_DIR: ${{ runner.temp }}/mathlib-cache
        run: |
          mapfile -t modules < <(
            git grep -h -E '^(public )?(meta )?import Mathlib\.' -- '*.lean' |
              awk '{for (i = 1; i <= NF; ++i) if ($i ~ /^Mathlib\./) {print $i; break}}' |
              sort -u
          )
          test "${#modules[@]}" -gt 0
          lake exe cache get "${modules[@]}"
          lake exe cache clean!
      - name: Verify mathematical regressions
        run: make test-lean
      - name: Verify ten LMFDB curve certificates
        run: make test-lmfdb-ci
      - name: Check Mathlib style and Lean declaration docstrings
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          if [[ -n "$PR_BASE" ]]; then
            base="$PR_BASE"
          elif [[ -n "$PUSH_BASE" && "$PUSH_BASE" != 0000000000000000000000000000000000000000 ]]; then
            base="$PUSH_BASE"
          else
            base=HEAD^
          fi
          uv run --locked python scripts/check_lean_style.py "$base"
