name: Lean verification
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  # PR updates share their merge ref. Give each main push its own group.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  lean:
    name: Lean certificates and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: verified-lcalc
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: verified-lcalc
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Lean and restore cached artifacts
        id: setup-lean
        uses: ./verified-lcalc/.github/actions/setup-lean
      - name: Verify mathematical regressions
        run: make test-lean
      - name: Verify ten LMFDB curve certificates
        run: make test-lmfdb-ci
      - name: Check Mathlib style and Lean declaration docstrings
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          if [[ -n "$PR_BASE" ]]; then
            base="$PR_BASE"
          elif [[ -n "$PUSH_BASE" && "$PUSH_BASE" != 0000000000000000000000000000000000000000 ]]; then
            base="$PUSH_BASE"
          else
            base=HEAD^
          fi
          uv run --locked python scripts/check_lean_style.py "$base"
      - name: Stage project Lean artifacts
        run: |
          # Export only root-package module artifacts. Lake materializes matches
          # into the clean build directory after checking current source inputs.
          lake -f lakefile.certificates.lean build \
            VerifiedLcalc:irArts CertifiedCurves:irArts VerifiedLcalcTests:irArts \
            +VerifiedLcalcTests.Fixtures.LmfdbCI:irArts -o .lake/project-outputs.jsonl
          rm -rf .lake/project-cache
          lake cache stage .lake/project-outputs.jsonl .lake/project-cache
          (cd .lake/project-cache && sha256sum -- *.ltar outputs.jsonl > checksums.sha256)
      - name: Save project Lean artifacts from main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: verified-lcalc/.lake/project-cache
          key: ${{ steps.setup-lean.outputs.project-cache-key }}
