[project]
name = "verified-lcalc-tools"
version = "0.1.0"
description = "Development and benchmark tools for the Lean certificate library"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.17.4,<0.18", "ty>=0.0.100,<0.1", "psycopg>=3.3,<4"]

[tool.uv]
package = false
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = [".lake", "data", "output", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ANN204", "ANN205", "ANN206"]

[tool.ty.src]
include = ["scripts", "tests"]
exclude = []

[tool.ty.environment]
python = ".venv"
python-version = "3.11"

[tool.ruff.lint.per-file-ignores]
"scripts/download_lmfdb_sql.py" = ["UP017"]
